<!DOCTYPE html>
<html lang="en">

<head>
    <title>Never Late To Try - Profile</title>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="comp1800 template" content="My 1800 App">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bottom Navbar -->
    <script type="module" src="/src/components/bottom-navbar.js"></script>
</head>

<body class="bg-body">

    <main class="container py-4 pb-5 mb-5">

        <!-- Header -->
        <h1 class="fw-bold fs-3 text-center mb-4">Profile</h1>

        <!-- Avatar + name -->
        <section class="text-center mb-4">

            <!-- Clicking the avatar opens the file picker (label points at the hidden input) -->
            <label for="imageInput" class="position-relative d-inline-block" style="cursor: pointer;">
                <i id="avatarIcon" class="bi bi-person-circle text-secondary" style="font-size: 7.5rem;"></i>
                <img id="profileImage" class="rounded-circle object-fit-cover d-none"
                    style="width: 120px; height: 120px;" alt="Profile picture">
                <span
                    class="position-absolute bottom-0 end-0 bg-body border rounded-circle d-flex align-items-center justify-content-center"
                    style="width: 36px; height: 36px;">
                    <i class="bi bi-camera-fill"></i>
                </span>
            </label>
            <input type="file" id="imageInput" class="d-none" accept="image/*">

            <p id="userName" class="fw-bold fs-5 mt-2 mb-0">&nbsp;</p>
            <label for="imageInput" class="text-secondary small" style="cursor: pointer;">Change photo</label>
        </section>

        <!-- Options -->
        <div class="list-group list-group-flush mx-auto" style="max-width: 480px;">

            <!-- Dark mode -->
            <div class="list-group-item bg-transparent d-flex align-items-center gap-3 py-4">
                <i class="bi bi-moon-fill fs-3 text-secondary"></i>
                <label for="darkModeToggle" class="flex-grow-1 fs-5 mb-0">Dark Mode</label>
                <div class="form-check form-switch fs-4 mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="darkModeToggle">
                </div>
            </div>

            <!-- Settings -->
            <a href="settings.html"
                class="list-group-item list-group-item-action bg-transparent d-flex align-items-center gap-3 py-4">
                <i class="bi bi-gear-fill fs-3 text-secondary"></i>
                <span class="fs-5">Settings</span>
            </a>

            <!-- Log out -->
            <button id="logoutBtn" type="button"
                class="list-group-item list-group-item-action bg-transparent d-flex align-items-center gap-3 py-4">
                <i class="bi bi-box-arrow-left fs-3 text-secondary"></i>
                <span class="fs-5">Log Out</span>
            </button>

        </div>

    </main>

    <bottom-navbar></bottom-navbar>

    <script type="module" src="/src/profile.js"></script>

</body>

</html>
