<!DOCTYPE html>
<html lang="en">

<head>
    <title>Never Late To Try - Login / Signup</title>
    <meta name="comp1800 template" content="My 1800 App">



    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Web Components for shared navbar and footer layout -->
    <!--<script type="module" src="/src/components/site-navbar.js"></script>-->
    <!--<script type="module" src="/src/components/site-footer.js"></script>-->
</head>

<body class="bg-light">
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <site-navbar></site-navbar>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="bg-white rounded-4 shadow-sm p-4 p-md-5 w-100" style="max-width: 430px;">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Never Late To Try</h2>
                <p class="text-secondary">Discover new activities at any age</p>
            </div>

            <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

            <!-- Login form -->
            <div id="loginView">
                <h4 class="text-center mb-4">Log In</h4>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>

                    <button type="submit" class="btn btn-secondary rounded-pill w-100">
                        Log In
                    </button>

                </form>

                <p class="text-center mt-4">
                    Don't have an account?
                    <a href="#" id="toSignup">Sign Up</a>
                </p>
            </div>

            <!-- Signup form -->
            <div id="signupView" class="d-none">
                <h4 class="text-center mb-4">Sign Up</h4>

                <form id="signupForm">

                    <div class="mb-3">
                        <label for="signupName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="signupName" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="signupEmail" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="signupPassword" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-secondary rounded-pill w-100">
                        Create Account
                    </button>

                </form>

                <p class="text-center mt-4">
                    Already have an account?
                    <a href="#" id="toLogin">Log In</a>
                </p>
            </div>

            <div class="text-center mt-3">
                <a href="/index.html" class="text-secondary text-decoration-none">
                    Back to Welcome
                </a>
            </div>

        </div>

    </main>

    <script type="module" src="/src/loginSignup.js"></script>
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
  

    <!-- our own navbar goes here -->
    <!-- <site-navbar></site-navbar> -->

    <!-- Main content goes here -->

    <!-- our own footer goes here -->
    <!-- <site-footer></site-footer> -->

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>

</body>

</html>
