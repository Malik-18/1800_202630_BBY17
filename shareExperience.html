<!DOCTYPE html>
<html lang="en">

<head>
    <title>Share Your Experience - Never Late To Try</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Bottom Navbar -->
    <script type="module" src="/src/components/bottom-navbar.js"></script>

   <link rel="icon" href="public/favicon.ico" type="image/x-icon">
</head>

<body class="bg-white">
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- Main content goes here -->
    <main class="container py-4 pb-5 mb-5">

        <!-- Screen 1: the review form -->
        <section id="formSection">

            <!-- Header with back button (goes back to this activity's reviews) -->
            <div class="position-relative text-center mb-4">
                <a id="backLink" href="/discover.html"
                    class="position-absolute top-50 start-0 translate-middle-y text-dark fs-3"
                    aria-label="Back to reviews">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <h1 class="fw-bold fs-3 mb-0">Share your experience</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-6">

                    <p id="activityName" class="fw-bold fs-5 text-center mb-3">Loading...</p>

                    <!-- Error message (hidden until needed) -->
                    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="reviewForm" novalidate>

                        <!-- Star rating: shareExperience.js fills in the stars when they are clicked -->
                        <div id="starRating" class="d-flex justify-content-center gap-3 mb-4">
                            <i class="bi bi-star fs-1" role="button" aria-label="1 star"></i>
                            <i class="bi bi-star fs-1" role="button" aria-label="2 stars"></i>
                            <i class="bi bi-star fs-1" role="button" aria-label="3 stars"></i>
                            <i class="bi bi-star fs-1" role="button" aria-label="4 stars"></i>
                            <i class="bi bi-star fs-1" role="button" aria-label="5 stars"></i>
                        </div>

                        <!-- Review text -->
                        <div class="mb-4">
                            <label for="reviewText" class="form-label">
                                Share details of your own experience at this activity
                            </label>
                            <textarea id="reviewText" class="form-control" rows="6"
                                placeholder="What did you enjoy? What do you wish you knew before you started?"
                                required></textarea>
                        </div>

                        <!-- One optional picture. Clicking the box opens the file picker. -->
                        <div class="mb-4">
                            <label for="imageInput"
                                class="d-flex flex-column align-items-center justify-content-center bg-light rounded-4 overflow-hidden mx-auto"
                                style="width: 180px; height: 180px; cursor: pointer;">
                                <span id="addPictureContent" class="text-center text-secondary">
                                    <i class="bi bi-plus-lg fs-1 d-block"></i>
                                    <span class="small">Add your picture</span>
                                </span>
                                <img id="previewImage" class="d-none w-100 h-100 object-fit-cover"
                                    alt="Selected picture">
                            </label>
                            <input type="file" id="imageInput" class="d-none" accept="image/*">

                            <div class="text-center">
                                <button id="removeImageBtn" type="button"
                                    class="btn btn-link btn-sm text-secondary d-none">
                                    Remove picture
                                </button>
                            </div>
                        </div>

                        <button id="submitBtn" type="submit" class="btn btn-dark rounded-pill w-100 py-2">
                            Share Experience
                        </button>

                    </form>

                </div>
            </div>

        </section>

        <!-- Screen 2: thank-you message (hidden until the review is saved) -->
        <section id="thanksSection" class="d-none">

            <div class="text-end">
                <a id="closeLink" href="/discover.html" class="text-dark fs-2" aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>

            <div class="text-center py-5 my-5">
                <i class="bi bi-patch-check-fill" style="font-size: 8rem;"></i>
                <h2 class="fs-3 mt-4">Thank you for sharing your experience with us</h2>
                <a id="seeReviewsBtn" href="/discover.html" class="btn btn-dark rounded-pill px-4 mt-3">
                    See all reviews
                </a>
            </div>

        </section>

    </main>

    <!-- Bottom Navigation -->
    <bottom-navbar></bottom-navbar>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/shareExperience.js"></script>

</body>

</html>
