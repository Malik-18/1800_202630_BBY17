<!DOCTYPE html>
<html lang="en">

<head>
    <title>Activity Details - Never Late To Try</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Bottom Navbar Component -->
    <script type="module" src="/src/components/bottom-navbar.js"></script>

</head>

<body class="bg-white">

    <!-- Main content -->
    <main class="container py-4 pb-5 mb-5">

        <a href="/discover.html" class="text-dark text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Discover
        </a>

        <div class="row justify-content-center mt-4">

            <div class="col-12 col-lg-8">

                <!-- Activity Navigation Buttons -->

                <div class="row g-3 text-center my-4">

                    <div class="col-4">
                        <a id="firstTimersBtn" href="#"
                            class="btn btn-outline-secondary rounded-4 w-100 py-3 d-flex flex-column align-items-center gap-2">
                            <i class="bi bi-people-fill fs-3"></i>
                            <span class="small">First Timers</span>
                        </a>
                    </div>

                    <div class="col-4">
                        <a id="expectationsBtn" href="#"
                            class="btn btn-outline-secondary rounded-4 w-100 py-3 d-flex flex-column align-items-center gap-2">
                            <i class="bi bi-list-check fs-3"></i>
                            <span class="small">Expectations</span>
                        </a>
                    </div>

                    <div class="col-4">
                        <a id="reviewsBtn" href="#"
                            class="btn btn-outline-secondary rounded-4 w-100 py-3 d-flex flex-column align-items-center gap-2">
                            <i class="bi bi-star fs-3"></i>
                            <span class="small">Reviews</span>
                        </a>
                    </div>

                </div>


                <!-- Activity Image -->
                <img id="activityImage" class="img-fluid rounded-4 w-100 object-fit-cover" style="max-height: 350px;"
                    alt="Activity image">

                <!-- Activity Name -->
                <h1 id="activityName" class="fw-bold mt-4">
                    Loading...
                </h1>

                <!-- Category -->
                <p id="activityCategory" class="text-secondary"></p>

                <!-- Description -->
                <div class="mt-4">
                    <h2 class="fs-5 fw-bold">About this activity</h2>
                    <p id="activityDescription"></p>
                </div>

                <!-- Difficulty -->
                <div class="mt-4">
                    <h2 class="fs-5 fw-bold">Difficulty</h2>
                    <p id="activityDifficulty"></p>
                </div>

                <!-- Location -->
                <div class="mt-4">
                    <h2 class="fs-5 fw-bold">Location</h2>
                    <p id="activityLocation"></p>
                </div>

                <!-- Duration -->
                <div class="mt-4">
                    <h2 class="fs-5 fw-bold">
                        <i class="bi bi-clock"></i> Duration
                    </h2>
                    <p id="activityDuration"></p>
                </div>

                <!-- Price -->
                <div class="mt-4">
                    <h2 class="fs-5 fw-bold">
                        <i class="bi bi-cash"></i> Price
                    </h2>
                    <p id="activityPrice"></p>
                </div>

            </div>

        </div>

        <div class="my-4 pb-5 text-center">
            <button id="saveToTryBtn" type="button" class="btn btn-outline-dark rounded-pill px-6 py-2" disabled>
                <i class="bi bi-heart me-2"></i>
                Save to Try
            </button>
        </div>

    </main>



    <!-- Bottom Navigation -->
    <bottom-navbar></bottom-navbar>

    <!-- JavaScript -->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/activity.js"></script>

</body>

</html>
