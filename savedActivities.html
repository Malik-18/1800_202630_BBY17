<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Activities - Never Late To Try</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Bottom Navbar -->
    <script type="module" src="/src/components/bottom-navbar.js"></script>

    <!-- Web Components for shared navbar and footer layout -->
    <!-- <script type="module" src="/src/components/site-navbar.js"></script> -->
    <!-- <script type="module" src="/src/components/site-footer.js"></script> -->
</head>

<body class="bg-white">
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <!-- <site-navbar></site-navbar> -->

    <!-- Main content goes here -->


    <main class="container py-4 pb-5 mb-5">

        <!-- Page Title -->
        <h1 class="fs-3 fw-bold mb-4">My Activities</h1>

        <!-- Navigation Tabs -->
        <div class="d-flex justify-content-around border-bottom mb-4">

            <button id="savedTab" class="btn border-0 border-bottom border-dark border-3 rounded-0 fw-bold">
                Saved
            </button>

            <button id="completedTab" class="btn border-0 rounded-0">
                Completed
            </button>

            <button id="progressTab" class="btn border-0 rounded-0">
                Progress
            </button>

        </div>

        <!-- Saved Activities -->
        <section id="savedSection">

            <h2 class="fs-5 fw-bold mb-3">
                Saved Activities
            </h2>

            <div id="savedActivitiesList" class="row g-3">

                <p class="text-secondary">
                    Loading saved activities...
                </p>

            </div>

        </section>

        <!-- Completed Activities -->
        <section id="completedSection" class="d-none">

            <h2 class="fs-5 fw-bold mb-3">
                Completed Activities
            </h2>

            <p class="text-secondary">
                Your completed activities will appear here.
            </p>

        </section>

        <!-- Progress -->
        <section id="progressSection" class="d-none">

            <h2 class="fs-5 fw-bold mb-3">
                My Progress
            </h2>

            <p class="text-secondary">
                Track your progress as you try new activities!
            </p>

        </section>

    </main>

    <!-- Bottom Navigation -->
    <bottom-navbar></bottom-navbar>

    <!-- our own footer goes here -->
    <!-- <site-footer></site-footer> -->

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/savedActivities.js"></script>

</body>

</html>
