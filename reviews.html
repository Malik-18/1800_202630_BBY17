<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-white">
    <!------------------------------>

    <!-- our own navbar goes here -->

    <!-- Main content goes here -->
    <!-- Extra bottom padding so the last review isn't hidden behind the fixed button + bottom navbar -->
    <main class="container py-4" style="padding-bottom: 180px;">

        <!-- Back Button -->
        <div class="d-flex align-items-center mb-4">
            <a id="backToActivity" href="/discover.html" class="text-dark fs-3 me-4" aria-label="Back to activity">
                <i class="bi bi-chevron-left"></i>
            </a>

            <h1 class="fs-4 mb-0">Reviews</h1>
        </div>

        <!-- Activity Name -->
        <h2 id="activityName" class="fs-5 fw-bold mb-1">
            Loading...
        </h2>

        <p class="text-secondary small mb-4">
            Tips and reviews from First Timers
        </p>

        <!-- Reviews List (filled in by reviews.js) -->
        <div id="reviewsList">

            <p class="text-secondary text-center">

            </p>

        </div>

    <!-- Share Experience button: fixed to the bottom of the screen, just above the bottom navbar.

    <div class="position-fixed bottom-0 start-0 end-0 bg-white pt-2" style="padding-bottom: 95px;">
        <div class="container">
            <a id="shareExperienceBtn" href="#" class="btn btn-dark rounded-pill w-100 py-2">
                Share Experience
            </a>
        </div>
    </div>
